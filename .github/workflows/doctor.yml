name: doctor

# Runs the diagnostic on GitHub instead of your machine — no local Python
# needed. Makes no API calls and writes nothing back to the repo.
#
#   gh workflow run doctor
#   gh run watch
#   gh run view --log
#
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Diagnose
        run: python doctor.py
