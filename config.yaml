site_title: Job Ledger

# ===========================================================================
# Staff / principal / lead — design & product — worldwide remote
#
# IMPORTANT: this covers BOTH product design and product management, because
# "design or product" is two different jobs with different vocabularies.
# Delete the half that isn't you — keeping both means roughly half your daily
# quota gets spent scoring roles you'd never take.
# Look for the >>> DESIGN <<< and >>> PRODUCT <<< markers below.
# ===========================================================================

# Your profile lives in the PROFILE GitHub secret (from profile.txt), not here.
profile: ""

# ---------------------------------------------------------------------------
# COMPANIES — deliberately empty.
#
# You don't have a list yet, and inventing one is what produced all those 404s.
# The aggregators below run fine without it. When a posting scores well, its
# company gets logged to state/discovered.json — promote those here as you find
# them, and you'll start seeing their roles the day they post rather than a day
# later through a cache.
#
# Format when you add some:
#   - {name: Linear, ats: ashby, slug: linear}
# The slug is the last part of their careers URL (jobs.ashbyhq.com/linear).
# ---------------------------------------------------------------------------
companies: []

# ---------------------------------------------------------------------------
# SEARCHES — your only source until companies fills up. Filters are applied
# server-side, which is the cheapest stage in the whole pipeline.
#
# `worldwide: true` is doing real work here: it returns only roles with no
# country restriction, which is what you asked for, and drops the large number
# of "remote (US only)" listings for free.
#
# Himalayas seniority values are: Entry-level, Mid-level, Senior, Manager,
# Director, Executive. There is no "Staff" — senior IC design roles are filed
# under Senior and lead roles under Manager, so ask for both.
# ---------------------------------------------------------------------------
searches:
  # >>> DESIGN <<<
  - {board: himalayas, label: product-design, q: "product designer",
     worldwide: true, seniority: [Senior, Manager], sort: recent}
  - {board: himalayas, label: design-lead, q: "design lead",
     worldwide: true, sort: recent}
  - {board: remotive,  label: design, search: "product designer", limit: 50}
  - {board: remoteok,  label: design, tags: design}

  # >>> PRODUCT <<<
  - {board: himalayas, label: product-mgmt, q: "product manager",
     worldwide: true, seniority: [Senior, Manager, Director], sort: recent}
  - {board: remotive,  label: product, search: "product manager", limit: 50}

# ---------------------------------------------------------------------------
# RULES — the coarse net. Deliberately loose to begin with.
#
# location_include is COMMENTED OUT ON PURPOSE. Every board writes locations
# differently, and an over-tight pattern here silently drops everything — that
# was the single biggest hazard in the config you had. You're already on
# remote-only boards asking for worldwide roles, so it's filtered upstream.
# Leave it off until you've seen a week of real output.
# ---------------------------------------------------------------------------
rules:
  title_include:
    - "design|designer|ux|ui\\b"                                     # >>> DESIGN <<<
    - "product manager|product owner|product lead|head of product"   # >>> PRODUCT <<<

  title_exclude:
    - "intern|graduate|apprentice|entry.level|junior"
    - "product marketing"                # different job; matches "product" constantly
    - "sales|recruit|account executive"
    - "graphic design|brand designer"    # delete this line if you DO want brand work

  # location_include:
  #   - "worldwide|global|anywhere|remote"

  description_exclude:
    - "must be (located|based) in the (us|united states)"
    - "security clearance"

# ---------------------------------------------------------------------------
# AFFINITY — the free ranking stage. Weighted regex over title + excerpt.
# A title hit is worth title_boost times a body hit. Each pattern counts once,
# so repetition can't game it.
#
# min_score is 0 ON PURPOSE. You've had a week of nothing, so let everything
# through and look at the real numbers first. Raise it later to sit just under
# where the good roles land.
# ---------------------------------------------------------------------------
affinity:
  keywords:
    # >>> DESIGN <<<
    'product design|product designer': 4
    'design system': 3
    'ux|user experience|interaction design': 2
    'user research|usability|discovery': 2
    'figma': 2
    'prototyp': 1

    # >>> PRODUCT <<<
    'product manage|product management|product owner': 4
    'roadmap|product strategy': 2
    'cross.functional': 1

    # level — the main thing separating a staff role from a mid one
    'staff|principal': 4
    '\blead\b|head of': 3
    'director': 2
    '\bsenior\b': 2

    # negatives — cheaper to sink here than to explain to the model
    'junior|entry.level|\bintern\b|graduate': -8
    'product marketing|growth marketing': -5
    '\bsales\b|account executive|business development': -6
    'engineer|developer|architect': -3
    # uncomment anything you want nothing to do with:
    # 'crypto|web3|blockchain|nft': -6
    # 'gambling|betting|casino': -6
    # 'defense|defence|military': -6

  title_boost: 3
  min_score: 0        # raise once you've seen real scores (doctor.py section 6)
  max_to_model: 25    # only the top N are ever paid for — this caps your cost

# ---------------------------------------------------------------------------
# COST CONTROLS
# ---------------------------------------------------------------------------
description_chars: 1200
batch_size: 15
max_scored_per_run: 40
polite_delay: 1.0
discovery_threshold: 7.0

# ---------------------------------------------------------------------------
# DISPLAY — lowered for the first week so you can see scores and calibrate.
# Raise display_threshold to 6 or 7 once you trust them.
# ---------------------------------------------------------------------------
display_threshold: 3.0
highlight_threshold: 8.0
retain_days: 21
