<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{% block title %}Job Ledger{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>{{ css|safe }}
/* -- supplementary styles for forms/tables/toggles, same ledger language -- */
h2.section{
  font-family:"Instrument Serif",Georgia,serif; font-weight:400;
  font-size:26px; margin:34px 0 10px; letter-spacing:-.01em;
}
h2.section:first-of-type{margin-top:6px}
table.grid{width:100%; border-collapse:collapse; margin-bottom:10px}
table.grid th{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--soft);
  text-align:left; padding:6px 10px; border-bottom:1px solid var(--ink);
}
table.grid td{
  padding:8px 10px; border-bottom:1px solid var(--rule); font-size:14px;
  vertical-align:middle;
}
table.grid tr:hover td{background:var(--card)}
table.grid td.num{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
  text-align:right;
}
table.grid td.zero{color:var(--fresh); font-weight:600}
form.inline{display:inline}
form.row-form{
  display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end;
  background:var(--card); border:1px solid var(--rule); border-radius:2px;
  padding:14px; margin-bottom:22px;
}
form.row-form label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--soft)}
form.settings-form{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;
  background:var(--card); border:1px solid var(--rule); border-radius:2px;
  padding:16px; margin-bottom:22px;
}
form.settings-form label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--soft)}
input[type=text],input[type=number],textarea,select{
  font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:14px;
  border:1px solid var(--rule); border-radius:2px; padding:7px 9px;
  background:#fff; color:var(--ink);
}
textarea{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px; min-height:90px; resize:vertical}
button{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px;
  letter-spacing:.08em; text-transform:uppercase; cursor:pointer;
  border:1px solid var(--ink); border-radius:2px; background:var(--ink);
  color:var(--card); padding:8px 14px;
}
button:hover{background:var(--strong); border-color:var(--strong)}
button.ghost{background:transparent; color:var(--soft); border-color:var(--rule)}
button.ghost:hover{color:var(--ink); border-color:var(--ink); background:transparent}
button.danger{background:transparent; color:var(--fresh); border-color:var(--fresh)}
button.danger:hover{background:var(--fresh); color:#fff}
.pill{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10px;
  letter-spacing:.08em; text-transform:uppercase; padding:2px 7px;
  border-radius:10px; border:1px solid var(--rule); color:var(--soft);
}
.pill.on{color:var(--strong); border-color:var(--strong)}
.pill.off{color:var(--fresh); border-color:var(--fresh)}
.flash{
  border:1px solid var(--strong); background:#e8f3f0; color:var(--strong);
  border-radius:2px; padding:10px 14px; margin-bottom:16px; font-size:14px;
}
.flash.error{border-color:var(--fresh); background:#fbe9de; color:var(--fresh)}
.hint{color:var(--soft); font-size:13px; max-width:60ch; margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>{% block h1 %}Job Ledger{% endblock %}</h1>
  <div class="nav">
    <a href="/" aria-current="{{ 'page' if active == 'board' else 'false' }}">Board</a>
    <a href="/runs" aria-current="{{ 'page' if active == 'runs' else 'false' }}">Runs</a>
    <a href="/config" aria-current="{{ 'page' if active == 'config' else 'false' }}">Configuration</a>
    <a href="/boards" aria-current="{{ 'page' if active == 'boards' else 'false' }}">Boards</a>
  </div>
</header>
{% if flash %}<div class="flash {{ 'error' if flash_error else '' }}">{{ flash }}</div>{% endif %}
{% block content %}{% endblock %}
</div>
</body>
</html>
